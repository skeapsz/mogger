name: Build Mogger

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download iOS SDK
        run: |
          wget -q https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS15.6.sdk ./iPhoneOS15.6.sdk

      - name: Build dylib
        run: |
          clang++ -target arm64-apple-ios15.0 \
            -isysroot ./iPhoneOS15.6.sdk \
            -std=c++17 -fobjc-arc -O2 \
            -dynamiclib -lobjc \
            -install_name @executable_path/Frameworks/Mogger.framework/Mogger \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics \
            -fuse-ld=lld \
            Mogger.mm -o Mogger

      - name: Package framework
        run: |
          mkdir -p Mogger.framework
          cp Mogger Mogger.framework/Mogger
          cat > Mogger.framework/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Mogger</string>
            <key>CFBundleIdentifier</key><string>com.mogger.hook</string>
            <key>CFBundleName</key><string>Mogger</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>1.0</string>
          </dict>
          </plist>
          EOF
          zip -r Mogger.framework.zip Mogger.framework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mogger-framework
          path: Mogger.framework.zip
